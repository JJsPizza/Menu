  /* ----- ORDER OF SECTIONS ON THE PAGE -----
     To reorder sections, just rearrange the names in this list. */
  const SECTION_ORDER = [
    "starters", "salads", "light", "burgers",
    "sandwiches", "wraps", "jjsspecial", "pizza",
    "glutenfree", "colddrinks",
  ];

  /* =====================================================================
     BUILDER  —  you do not need to touch anything below this line.
     ===================================================================== */
  (function buildMenu() {
    const root = document.getElementById("menu-root");
    if (!root) return;

    const esc = s => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function gridItem(item, sectionFilter, centered) {
      const f = item.filter || sectionFilter;
      const centerCls = centered ? " text-center" : "";
      let html = `<div class="col-lg-6 menu-item filter-${f}${centerCls}">`;
      if (item.price) {
        html += `<div class="menu-content">${esc(item.name)}<span>${esc(item.price)}</span></div>`;
      } else {
        html += `<div class="menu-content">${esc(item.name)}</div>`;
      }
      if (item.ingredients) {
        html += `<div class="menu-ingredients">${esc(item.ingredients)}</div>`;
      }
      html += `</div>`;
      return html;
    }

    function gridSection(sec) {
      const f = sec.filter;
      let html = `<div class="${sec.wrap === "salads" ? "salads" : "sand"} row">`;
      // Heading (some sections use an image instead, so heading may be absent)
      if (sec.heading) {
        const center = sec.centered ? " text-center" : "";
        html += `<div class="col-lg-12 menu-item filter-${f}${center}"><br>`;
        if (sec.centered) {
          html += `<span class="${sec.headingClass}">${esc(sec.heading)}</span>`;
        } else {
          html += `<div class="text-center"><span class="${sec.headingClass}">${esc(sec.heading)}</span></div>`;
        }
        html += `</div>`;
      }
      if (sec.headerHTML) html += sec.headerHTML;
      sec.items.forEach(it => { html += gridItem(it, f, sec.centered); });
      if (sec.footerHTML) html += sec.footerHTML;
      html += `<div class="col-lg-12 menu-item filter-${f}"><br></div>`;
      html += `</div>`;
      return html;
    }

    function pizzaSection(sec) {
      let html = `<div class="col-lg-12 menu-item filter-pizza"><br></div>`;
      html += `<div class="menu-item filter-pizza"><br>`;
      html += `<div class="text-center"><span class="highlightsand" style="color: #fff !important;">${esc(sec.heading)}</span></div>`;
      if (sec.headerHTML) html += sec.headerHTML;
      html += `<br><table class="pizza-menu-table">`;
      html += `<thead><tr><th> </th><th>Small</th><th>Medium</th><th>Large</th></tr></thead><tbody>`;
      sec.items.forEach(p => {
        html += `<tr><td><div class="pizza-name">${esc(p.name)}</div>`;
        if (p.ingredients) html += `<div class="pizza-ingredients">${esc(p.ingredients)}</div>`;
        html += `</td><td>${esc(p.s)}</td><td>${esc(p.m)}</td><td>${esc(p.l)}</td></tr>`;
      });
      if (sec.stromboli) {
        html += `<tr><td colspan="3" class="text-center"><div class="pizza-name">${esc(sec.stromboli.name)}</div></td>`;
        html += `<td class="text-center">${esc(sec.stromboli.price)}</td></tr>`;
      }
      html += `</tbody></table></div>`;
      html += `<div class="col-lg-12 menu-item filter-pizza"><br></div>`;
      return html;
    }

    let out = "";
    SECTION_ORDER.forEach(key => {
      const sec = MENU[key];
      if (!sec) return;
      out += (sec.type === "pizza") ? pizzaSection(sec) : gridSection(sec);
    });
    root.innerHTML = out;
  })();
  </script>
